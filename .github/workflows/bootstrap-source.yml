name: Materialize source and installer
on:
  push:
    paths:
      - 'payload/READY'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract source
        shell: bash
        run: |
          set -euo pipefail
          test -s payload/READY
          test "$(ls payload/chunk-*.txt | wc -l)" -eq 8
          cat payload/chunk-*.txt | base64 -d > /tmp/source.tar.gz
          tar -tzf /tmp/source.tar.gz | while IFS= read -r p; do
            case "$p" in
              /*|../*|*/../*|*/..|*.env|*.env.*) echo "Unsafe entry: $p" >&2; exit 1;;
            esac
          done
          tar -xzf /tmp/source.tar.gz
      - name: Build installable ZIP
        run: |
          mkdir -p dist
          mkdir -p /tmp/zp24-installer/GravityForms-master
          cp index.php /tmp/zp24-installer/GravityForms-master/
          cp -r includes /tmp/zp24-installer/GravityForms-master/
          cp README.md CHANGELOG.md LICENSE /tmp/zp24-installer/GravityForms-master/
          cd /tmp/zp24-installer && zip -q -r "$GITHUB_WORKSPACE/dist/ZarinPal-GravityForms-2.4.0.zip" GravityForms-master
      - name: Validate PHP
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/smoke.php
      - name: Commit extracted source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.php includes tests .gitignore LICENSE scripts .github/workflows/php-checks.yml dist
          git diff --cached --quiet || (git commit -m 'feat: publish ZarinPal 2.4 source and installer' && git push)
