name: Publish v2.4.0 pre-release
on:
  push:
    paths:
      - '.github/workflows/publish-pre-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify installable archive exists
        run: |
          test -s dist/ZarinPal-GravityForms-2.4.0.zip
          unzip -t dist/ZarinPal-GravityForms-2.4.0.zip
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.4.0 >/dev/null 2>&1; then
            echo "Release v2.4.0 already exists; refusing to overwrite automatically."
            exit 0
          fi
          gh release create v2.4.0 \
            dist/ZarinPal-GravityForms-2.4.0.zip \
            --title "ZarinPal Gravity Forms 2.4.0 (Preview)" \
            --notes-file RELEASE_NOTES_v2.4.0.md \
            --prerelease \
            --target main
